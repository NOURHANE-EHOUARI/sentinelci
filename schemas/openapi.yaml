  /api/v1/waivers/{sha256}:
    put:
      tags:
      - waivers
      summary: Record Waivers
      description: Keep a waivers file a recorded decision read, byte for byte, by
        its sha256. Never judged here.
      operationId: record_waivers_api_v1_waivers__sha256__put
      security:
      - HTTPBearer: []
      parameters:
      - name: sha256
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: The file's sha256, lowercase hex.
          title: Sha256
        description: The file's sha256, lowercase hex.
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaiversFileOut'
        '200':
          description: 'This file is recorded already: its record.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WaiversFileOut'
        '401':
          description: 'No valid ingestion token (`Authorization: Bearer <token>`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: 'No recorded decision read this file (`inputs.waivers_digest`):
            record the decision first.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '413':
          description: The file is larger than the upload limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '415':
          description: The file is not sent as `application/yaml`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: No database is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        description: The waivers file (schemas/waivers.v1.json, `.sentinel/waivers.yaml`)
          as the gate read it; empty when there was none.
        content:
          application/yaml:
            schema:
              type: string
    get:
      tags:
      - waivers
      summary: Get Waivers File
      description: A recorded waivers file, exactly as it was sent.
      operationId: get_waivers_file_api_v1_waivers__sha256__get
      parameters:
      - name: sha256
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
          description: The file's sha256, lowercase hex.
          title: Sha256
        description: The file's sha256, lowercase hex.
      responses:
        '200':
          description: 'The waivers file byte for byte: its sha256 is the ETag.'
          content:
            application/yaml:
              schema:
                type: string
        '404':
          description: No waivers file of this sha256 is recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: No database is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/waivers:
