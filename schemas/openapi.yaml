# Platform API v1 (SPEC section 13.3). Generated by `python -m sentinel_api.openapi`: do not edit.
openapi: 3.1.0
info:
  title: SentinelCI API
  version: 1.9.0
paths:
  /healthz:
    get:
      tags:
      - ops
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Healthz Healthz Get
  /api/v1/runs:
    post:
      tags:
      - runs
      summary: Create Run
      description: 'Record a pipeline run. Its findings are uploaded next, once.


        A CI run is recorded once: the same `repo`, `commit`, `context` and `run_id`
        again (a re-run of the upload

        step) is answered 409 with the existing run, which the client resumes instead
        of recording the findings a

        second time. A run without `run_id` (a local run) is always a new run.'
      operationId: create_run_api_v1_runs_post
      security:
      - HTTPBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunOut'
        '401':
          description: 'No valid ingestion token (`Authorization: Bearer <token>`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '413':
          description: The request body is larger than the limit (64 KiB, or the upload
            limit for findings).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: No database is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: 'This CI run (`repo`, `commit`, `context`, `run_id`) is recorded
            already: see `run`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunExists'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - runs
      summary: List Runs
      description: 'Recorded runs, newest first (the run id breaks ties). For a fixed
        set of runs, walking the pages never

        repeats or skips one; while runs are being recorded, a new run at the top
        shifts later pages by one, and a

        run''s `created_at` is the start of its transaction, so a run committed later
        can sort as older.


        `ref` is matched exactly (`refs/heads/main`), like `repo`. A run whose findings
        are not uploaded yet is

        listed too: its `findings_sha256` is null.'
      operationId: list_runs_api_v1_runs_get
      parameters:
      - name: repo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
            pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
          - type: 'null'
          title: Repo
      - name: context
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - pr
            - release
            - local
            type: string
          - type: 'null'
          title: Context
      - name: ref
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 255
            pattern: ^[^\r\n\u2028\u2029]*$
          - type: 'null'
          title: Ref
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000000
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunPage'
        '413':
          description: The request body is larger than the limit (64 KiB, or the upload
            limit for findings).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: No database is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runs/{run_id}:
    get:
      tags:
      - runs
      summary: Get Run
      operationId: get_run_api_v1_runs__run_id__get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunOut'
        '404':
          description: No such run or finding, or no findings recorded for the run
            (yet).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '413':
          description: The request body is larger than the limit (64 KiB, or the upload
            limit for findings).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: No database is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runs/{run_id}/findings:
    post:
      tags:
      - runs
      summary: Upload Findings
      description: 'Record the run''s findings: Finding v1 NDJSON, all of them in
        one upload, all or nothing.'
      operationId: upload_findings_api_v1_runs__run_id__findings_post
      security:
      - HTTPBearer: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
        '401':
          description: 'No valid ingestion token (`Authorization: Bearer <token>`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: No such run or finding, or no findings recorded for the run
            (yet).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: This run's findings are already recorded; compare `findings_sha256`
            from `GET /runs/{run_id}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '413':
          description: The request body is larger than the limit (64 KiB, or the upload
            limit for findings).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '415':
          description: The findings upload is not `application/x-ndjson`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: No database is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
    get:
      tags:
      - runs
      summary: Get Run Findings
      description: 'The run''s findings exactly as uploaded: what to hash, correlate
        or replay against `findings_sha256`.'
      operationId: get_run_findings_api_v1_runs__run_id__findings_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      responses:
        '200':
          description: 'The upload byte for byte: its sha256 is the run''s `findings_sha256`,
            the ETag.'
          content:
            application/x-ndjson:
              schema:
                type: string
        '404':
          description: No such run or finding, or no findings recorded for the run
            (yet).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '413':
          description: The request body is larger than the limit (64 KiB, or the upload
            limit for findings).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: No database is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/findings:
    get:
      tags:
      - findings
      summary: List Findings
      description: Findings as each run reported them, newest run first.
      operationId: list_findings_api_v1_findings_get
      parameters:
      - name: repo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
            pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
          - type: 'null'
          title: Repo
      - name: run_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Run Id
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - SECRET
            - SAST
            - SCA
            - CONTAINER
            - IAC
            - PIPELINE
            - LICENSE
            type: string
          - type: 'null'
          title: Category
      - name: severity
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - CRITICAL
            - HIGH
            - MEDIUM
            - LOW
            - INFO
            type: string
          - type: 'null'
          title: Severity
      - name: tool
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 200
          - type: 'null'
          title: Tool
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000000
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingPage'
        '413':
          description: The request body is larger than the limit (64 KiB, or the upload
            limit for findings).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: No database is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/findings/{finding_id}:
    get:
      tags:
      - findings
      summary: Get Finding
      description: One finding (its fingerprint), as the latest run reported it, and
        the newest runs that reported it.
      operationId: get_finding_api_v1_findings__finding_id__get
      parameters:
      - name: finding_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Finding Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingDetail'
        '404':
          description: No such run or finding, or no findings recorded for the run
            (yet).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '413':
          description: The request body is larger than the limit (64 KiB, or the upload
            limit for findings).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: No database is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runs/{run_id}/correlations:
    post:
      tags:
      - correlations
      summary: Record Correlation
      description: 'Record a correlation of the run''s findings (advisory: the gate
        never reads it), kept byte for byte.'
      operationId: record_correlation_api_v1_runs__run_id__correlations_post
      security:
      - HTTPBearer: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorrelationOut'
        '401':
          description: 'No valid ingestion token (`Authorization: Bearer <token>`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: No such run, or no correlation (version) recorded for it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '413':
          description: The document is larger than the upload limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '415':
          description: The correlation is not `application/json`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: No database is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: These exact bytes are recorded already (`correlation`), or
            the run's findings are not recorded yet (`detail` only).
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/CorrelationExists'
                - $ref: '#/components/schemas/ErrorOut'
                title: Response 409 Record Correlation Api V1 Runs  Run Id  Correlations
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        description: One Correlation v1 document (schemas/correlation.v1.json) of
          the run's findings.
        content:
          application/json:
            schema:
              type: object
    get:
      tags:
      - correlations
      summary: Get Correlation
      description: The run's latest correlation, or the version `sha256`, exactly
        as it was posted.
      operationId: get_correlation_api_v1_runs__run_id__correlations_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      - name: sha256
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            pattern: ^[a-f0-9]{64}$
          - type: 'null'
          description: A version; the latest without it.
          title: Sha256
        description: A version; the latest without it.
      responses:
        '200':
          description: 'The version byte for byte: its sha256 is the version''s name,
            the ETag.'
          content:
            application/json:
              schema:
                type: object
        '404':
          description: No such run, or no correlation (version) recorded for it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '413':
          description: The document is larger than the upload limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: No database is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
