# Platform API v1 (SPEC section 13.3). Generated by `python -m sentinel_api.openapi`: do not edit.
openapi: 3.1.0
info:
  title: SentinelCI API
  version: 1.0.0
paths:
  /healthz:
    get:
      tags:
      - ops
      summary: Healthz
      operationId: healthz_healthz_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Healthz Healthz Get
  /api/v1/runs:
    post:
      tags:
      - runs
      summary: Create Run
      description: Record a pipeline run. Its findings are uploaded next, once.
      operationId: create_run_api_v1_runs_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunOut'
        '401':
          description: 'No valid ingestion token (`Authorization: Bearer <token>`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '413':
          description: The request body is larger than the limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: No database is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/runs/{run_id}:
    get:
      tags:
      - runs
      summary: Get Run
      operationId: get_run_api_v1_runs__run_id__get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunOut'
        '404':
          description: No such run or finding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: No database is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runs/{run_id}/findings:
    post:
      tags:
      - runs
      summary: Upload Findings
      description: 'Record the run''s findings: Finding v1 NDJSON, all of them in
        one upload, all or nothing.'
      operationId: upload_findings_api_v1_runs__run_id__findings_post
      security:
      - HTTPBearer: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadResult'
        '401':
          description: 'No valid ingestion token (`Authorization: Bearer <token>`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: No such run or finding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: This run's findings are already recorded; compare `findings_sha256`
            from `GET /runs/{run_id}`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '413':
          description: The request body is larger than the limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '415':
          description: The findings upload is not `application/x-ndjson`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: No database is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        content:
          application/x-ndjson:
            schema:
              type: string
  /api/v1/findings:
    get:
      tags:
      - findings
      summary: List Findings
      description: Findings as each run reported them, newest run first.
      operationId: list_findings_api_v1_findings_get
      parameters:
      - name: repo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
            pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
          - type: 'null'
          title: Repo
      - name: run_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Run Id
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - SECRET
            - SAST
            - SCA
            - CONTAINER
            - IAC
            - PIPELINE
            - LICENSE
            type: string
          - type: 'null'
          title: Category
      - name: severity
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - CRITICAL
            - HIGH
            - MEDIUM
            - LOW
            - INFO
            type: string
          - type: 'null'
          title: Severity
      - name: tool
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 200
          - type: 'null'
          title: Tool
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000000
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingPage'
        '503':
          description: No database is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/findings/{finding_id}:
    get:
      tags:
      - findings
      summary: Get Finding
      description: One finding (its fingerprint), as the latest run reported it, and
        the newest runs that reported it.
      operationId: get_finding_api_v1_findings__finding_id__get
      parameters:
      - name: finding_id
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
          title: Finding Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FindingDetail'
        '404':
          description: No such run or finding.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: No database is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    ErrorOut:
      properties:
        detail:
          type: string
          title: Detail
      type: object
      required:
      - detail
      title: ErrorOut
      description: Every error except 422, which keeps FastAPI's list of validation
        errors (`HTTPValidationError`).
    FindingDetail:
      properties:
        finding:
          additionalProperties: true
          type: object
          title: Finding
        occurrence_count:
          type: integer
          title: Occurrence Count
        occurrences:
          items:
            $ref: '#/components/schemas/Occurrence'
          type: array
          title: Occurrences
      type: object
      required:
      - finding
      - occurrence_count
      - occurrences
      title: FindingDetail
    FindingItem:
      properties:
        run_id:
          type: string
          format: uuid
          title: Run Id
        finding:
          additionalProperties: true
          type: object
          title: Finding
      type: object
      required:
      - run_id
      - finding
      title: FindingItem
    FindingPage:
      properties:
        items:
          items:
            $ref: '#/components/schemas/FindingItem'
          type: array
          title: Items
        total:
          type: integer
          title: Total
        limit:
          type: integer
          title: Limit
        offset:
          type: integer
          title: Offset
      type: object
      required:
      - items
      - total
      - limit
      - offset
      title: FindingPage
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Occurrence:
      properties:
        run_id:
          type: string
          format: uuid
          title: Run Id
        repo:
          type: string
          title: Repo
        commit:
          type: string
          title: Commit
        context:
          type: string
          enum:
          - pr
          - release
          - local
          title: Context
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - run_id
      - repo
      - commit
      - context
      - created_at
      title: Occurrence
    RunCreate:
      properties:
        repo:
          type: string
          maxLength: 200
          pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
          title: Repo
        commit:
          type: string
          pattern: ^[a-f0-9]{40}$
          title: Commit
        context:
          type: string
          enum:
          - pr
          - release
          - local
          title: Context
        ref:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
            pattern: ^[^\r\n\u2028\u2029]*$
          - type: 'null'
          title: Ref
        run_id:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
            pattern: ^[^\r\n\u2028\u2029]*$
          - type: 'null'
          title: Run Id
      additionalProperties: false
      type: object
      required:
      - repo
      - commit
      - context
      title: RunCreate
    RunOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        repo:
          type: string
          title: Repo
        commit:
          type: string
          title: Commit
        context:
          type: string
          enum:
          - pr
          - release
          - local
          title: Context
        ref:
          anyOf:
          - type: string
          - type: 'null'
          title: Ref
        run_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Run Id
        created_at:
          type: string
          format: date-time
          title: Created At
        finding_count:
          type: integer
          title: Finding Count
        findings_sha256:
          anyOf:
          - type: string
          - type: 'null'
          title: Findings Sha256
        findings_uploaded_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Findings Uploaded At
      type: object
      required:
      - id
      - repo
      - commit
      - context
      - ref
      - run_id
      - created_at
      - finding_count
      - findings_sha256
      - findings_uploaded_at
      title: RunOut
    UploadResult:
      properties:
        run_id:
          type: string
          format: uuid
          title: Run Id
        finding_count:
          type: integer
          title: Finding Count
        findings_sha256:
          type: string
          title: Findings Sha256
      type: object
      required:
      - run_id
      - finding_count
      - findings_sha256
      title: UploadResult
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
