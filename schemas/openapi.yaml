                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: No database is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/runs/{run_id}/decision:
    post:
      tags:
      - decisions
      summary: Record Decision
      description: Record the run's gate decision (one per run), kept byte for byte.
        The platform never decides.
      operationId: record_decision_api_v1_runs__run_id__decision_post
      security:
      - HTTPBearer: []
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DecisionOut'
        '401':
          description: 'No valid ingestion token (`Authorization: Bearer <token>`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '404':
          description: No such run, or no decision recorded for it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '413':
          description: The document is larger than the upload limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '415':
          description: The decision is not `application/json`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: No database is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: 'The run''s decision is recorded already, these bytes or others
            (`decision`); the `decision_id` is another run''s (`decision`: that run''s);
            or the run''s findings are not recorded yet (`detail` only).'
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/DecisionExists'
                - $ref: '#/components/schemas/ErrorOut'
                title: Response 409 Record Decision Api V1 Runs  Run Id  Decision
                  Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        description: The Decision v1 document (schemas/decision.v1.json) the gate
          made on the run's findings, as `sentinel evaluate` wrote it.
        content:
          application/json:
            schema:
              type: object
    get:
      tags:
      - decisions
      summary: Get Decision
      description: The run's gate decision, exactly as it was posted.
      operationId: get_decision_api_v1_runs__run_id__decision_get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Run Id
      responses:
        '200':
          description: 'The decision byte for byte: its sha256 is the ETag.'
          content:
            application/json:
              schema:
                type: object
        '404':
          description: No such run, or no decision recorded for it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '413':
          description: The document is larger than the upload limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: No database is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/releases:
    post:
      tags:
      - releases
      summary: Record Release
      description: Record a release decision and the trust reports of its image, kept
        byte for byte, once.
      operationId: record_release_api_v1_releases_post
      security:
      - HTTPBearer: []
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseOut'
        '401':
          description: 'No valid ingestion token (`Authorization: Bearer <token>`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '413':
          description: The document is larger than the upload limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '415':
          description: The evidence is not `application/json`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: No database is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: 'The decision is recorded already (`release`): with these bytes,
            or with other evidence, which never changes.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseExists'
        '422':
          description: 'Not a Release evidence v1 document, or one that contradicts
            itself: a BLOCK with a trust report, a report about another image, repository
            or decision (the reason is in `msg`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        description: One Release evidence v1 document (schemas/release-evidence.v1.json).
        content:
          application/json:
            schema:
              type: object
    get:
      tags:
      - releases
      summary: List Releases
      description: The releases, newest first (as recorded), without their documents.
      operationId: list_releases_api_v1_releases_get
      parameters:
      - name: repo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
            pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
          - type: 'null'
          title: Repo
      - name: verdict
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - PASS
            - WARN
            - BLOCK
            type: string
          - type: 'null'
          title: Verdict
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000000
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleasePage'
        '413':
          description: The document is larger than the upload limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: No database is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/releases/{image_digest}/evidence:
    get:
      tags:
      - releases
      summary: Get Release Evidence
      description: 'The image''s release recorded last (or the release `decision_id`),
        exactly as it was posted. "Last"

        is the order of recording, not of the decisions: a late upload of an older
        decision becomes the one

        served without `decision_id`.'
      operationId: get_release_evidence_api_v1_releases__image_digest__evidence_get
      parameters:
      - name: image_digest
        in: path
        required: true
        schema:
          type: string
          pattern: ^sha256:[a-f0-9]{64}$
          title: Image Digest
      - name: decision_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          description: One release of the image; without it, the one recorded last.
          title: Decision Id
        description: One release of the image; without it, the one recorded last.
      responses:
        '200':
          description: 'The Release evidence v1 document byte for byte: its sha256
            is the ETag.'
          content:
            application/json:
              schema:
                type: object
        '404':
          description: No release recorded for this image (or this decision).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '413':
          description: The document is larger than the upload limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: No database is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/remediations:
    post:
      tags:
      - remediations
      summary: Record Remediation
      description: Record one attempt of the remediation loop (its proposal and result),
        byte for byte, once.
      operationId: record_remediation_api_v1_remediations_post
      security:
      - HTTPBearer: []
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediationOut'
        '401':
          description: 'No valid ingestion token (`Authorization: Bearer <token>`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '413':
          description: The document is larger than the upload limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '415':
          description: The attempt is not `application/json`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: No database is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '409':
          description: 'The proposal''s attempt is recorded already (`remediation`):
            with these bytes, or with another document, which never changes.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediationExists'
        '422':
          description: 'Not a Remediation attempt v1 document (values of another JSON
            type included), or one that contradicts itself: a VERIFIED the gate refuses,
            a result about another proposal or attempt, verified before it was proposed
            (the reason is in `msg`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        description: One Remediation attempt v1 document (schemas/remediation-attempt.v1.json).
        content:
          application/json:
            schema:
              type: object
    get:
      tags:
      - remediations
      summary: List Remediations
      description: The attempts, newest first (as recorded), without their documents.
      operationId: list_remediations_api_v1_remediations_get
      parameters:
      - name: repo
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            maxLength: 200
            pattern: ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$
          - type: 'null'
          title: Repo
      - name: strategy
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - deterministic:dependency-bump
            - deterministic:dockerfile
            - deterministic:kubernetes
            - llm:code
            type: string
          - type: 'null'
          title: Strategy
      - name: outcome
        in: query
        required: false
        schema:
          anyOf:
          - enum:
            - VERIFIED
            - REJECTED
            - FAILED
            type: string
          - type: 'null'
          title: Outcome
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 500
          minimum: 1
          default: 100
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000000
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemediationPage'
        '413':
          description: The document is larger than the upload limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '503':
          description: No database is configured.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/remediations/{proposal_id}:
