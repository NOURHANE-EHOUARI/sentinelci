# Local hooks only: they run the tools pinned in uv.lock, so no third-party hook repository is fetched.
repos:
  - repo: local
    hooks:
      # A local guard on top of main's server-side protection (ADR-0016): refuse commits on main before a push.
      - id: no-commit-to-main
        name: refuse commits on main (work on a task branch and open a PR)
        entry: sh -c 'if [ "$(git rev-parse --abbrev-ref HEAD)" = "main" ]; then echo "Commits on main are not allowed. Create a branch, e.g. git switch -c a2/my-change"; exit 1; fi'
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: contracts
        name: JSON Schema contracts
        entry: uv run pytest -q tests/contracts
        language: system
        files: ^schemas/
        pass_filenames: false
