# Local hooks only: they run the tools pinned in uv.lock, so no third-party hook repository is fetched.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: contracts
        name: JSON Schema contracts
        entry: uv run pytest -q tests/contracts
        language: system
        files: ^schemas/
        pass_filenames: false
