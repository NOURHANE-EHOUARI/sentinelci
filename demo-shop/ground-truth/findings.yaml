    owner: B9
    category: SAST
    title: Order import loads untrusted YAML with FullLoader (pyyaml 5.3.1, GT-SCA-001)
    relevance: 3  # B8 ranking (README, rubric fixed before any ranking was computed)
    relevance_why: >-
