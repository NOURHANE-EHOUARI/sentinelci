    relevance: 2  # B8 ranking (README, rubric fixed before any ranking was computed)
    relevance_why: >-
      a privileged root container with the host's network and file system: a compromise of shop-api becomes
      the node's, but it needs that compromise first
    location: {path: infra/k8s/shop-api.yaml, line: 25}
    expected:
      detections:
