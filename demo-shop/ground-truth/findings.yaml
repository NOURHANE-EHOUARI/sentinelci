  # ---------------------------------------------------------------- container image (A9)
  # The BLOCK image (ADR-0011 decision 6): services/shop-api/Dockerfile.release built with the build argument
  # REQUIREMENTS=requirements.block.txt. `sentinel scan image` reports its CONTAINER findings from the image's
  # OCI layout archive; README.md ("Container seeds") gives the build and the opt-in check of the detection.
  - id: GT-CONTAINER-001
    owner: A9
    category: CONTAINER
    title: The shop-api BLOCK image installs pyyaml 5.3.1 (code execution through FullLoader)
    location: {path: services/shop-api/requirements.block.txt, line: 352}
    image:
      dockerfile: services/shop-api/Dockerfile.release
      build_args: {REQUIREMENTS: requirements.block.txt}
    package: pkg:pypi/pyyaml@5.3.1
    vulnerability: GHSA-8q59-q68h-6hv4
    cve: CVE-2020-14343
    kev: false
    relevance: 2  # B8 ranking (README: a seed added later, graded by the rubric; CONTAINER is not ranked yet)
    relevance_why: >-
      the same code execution as GT-SCA-001, but only in the BLOCK image, which is built to be refused (the
      gate blocks it and the attest step never signs it): a component demo-shop never deploys
    expected:
      gate: SC-002
      detections:
        - {tool: grype, rule: GHSA-8q59-q68h-6hv4}

  # ---------------------------------------------------------------- application code (B9)
  # shop-api's routes (services/shop-api/app/main.py). Detections verified with the pinned Opengrep 1.33.1 and
  # SentinelCI's rules (PR #40); app/orders.py does the same things safely (GT-CLEAN-005). `gate` is what the
  # engine gives with no enrichment and no sentinel.yaml: SAST HIGH scores P1 (SC-006, WARN), MEDIUM P2.
  - id: GT-SAST-001
    owner: B9
    category: SAST
    title: Product search builds its SQL from the query string
    relevance: 3  # B8 ranking (README, rubric fixed before any ranking was computed)
    relevance_why: >-
      SQL injection in a public route of the internet-facing shop-api
    location: {path: services/shop-api/app/main.py, line: 31}
    expected:  # HIGH, P1: a warning
      gate: SC-006
      detections:
        - {tool: opengrep, rule: python-sql-built-from-strings}

