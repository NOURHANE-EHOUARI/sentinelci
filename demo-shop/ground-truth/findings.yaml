    relevance: 3  # B8 ranking (README, rubric fixed before any ranking was computed)
    relevance_why: >-
      command injection in a public route of the internet-facing shop-api
    location: {path: services/shop-api/app/main.py, line: 49}
    expected:  # HIGH, P1: a warning
      gate: SC-006
      detections:
