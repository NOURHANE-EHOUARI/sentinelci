# Ground truth of the demo-shop benchmark (SPEC section 17).
# Format: see README.md in this directory. Draft v1 proposed by A9; B9 owns the final schema.
# Paths are relative to demo-shop/. Detections were verified with the pinned tools:
# Gitleaks 8.30.1, Trivy 0.76.1 (embedded checks plus SentinelCI's own, SentinelCI configuration),
# zizmor 1.31.1, and Checkov 3.4.0 (not pinned yet: its adapter is part of A1). SCA detections are Grype
# 0.121.0's on the pinned Syft 1.55.0's SBOM, verified with the Grype database built 2026-11-01T06:20:12Z
# (schema v6.1.10); they need such a database to be checked again (see README.md, Checks).
version: 1

seeds:
  # ---------------------------------------------------------------- secrets (A9): all FAKE
  - id: GT-SECRET-001
    owner: A9
    category: SECRET
    title: GitHub token in the shop-api settings
    location: {path: services/shop-api/config/settings.yaml, line: 8}
    fake: true
    expected:
      gate: SC-001
      detections:
        - {tool: gitleaks, rule: github-pat}

  - id: GT-SECRET-002
    owner: A9
    category: SECRET
    title: npm publish token in the web app's .npmrc
    location: {path: services/web/.npmrc, line: 3}
    fake: true
    expected:
      gate: SC-001
      detections:
        - {tool: gitleaks, rule: npm-access-token}

  - id: GT-SECRET-003
    owner: A9
    category: SECRET
    title: AWS access key hard-coded in the Terraform provider
    location: {path: infra/terraform/providers.tf, line: 14}
    fake: true
    expected:
      gate: SC-001
      detections:
        - {tool: gitleaks, rule: aws-access-token}
        - {tool: checkov, rule: CKV_AWS_41}

  - id: GT-SECRET-004
    owner: A9
    category: SECRET
    title: TLS private key committed in a Kubernetes Secret
    location: {path: infra/k8s/shop-tls-secret.yaml, line: 15}
    fake: true
    expected:
      gate: SC-001
      detections:
        - {tool: gitleaks, rule: private-key}

  - id: GT-SECRET-005
    owner: A9
    category: SECRET
    title: Slack webhook in the production GitOps values
    location: {path: gitops/values-prod.yaml, line: 7}
    fake: true
    expected:
      gate: SC-001
      detections:
        - {tool: gitleaks, rule: slack-webhook-url}

  # ---------------------------------------------------------------- infrastructure as code (A9)
  - id: GT-IAC-001
    owner: A9
    category: IAC
    title: Product-images bucket public through its ACL and public-access block
    location: {path: infra/terraform/storage.tf, line: 8}
    expected:
      detections:
        - {tool: trivy, rule: AWS-0092}
        - {tool: trivy, rule: AWS-0086}
        - {tool: checkov, rule: CKV_AWS_20}

  - id: GT-IAC-002
    owner: A9
    category: IAC
    title: SSH open to 0.0.0.0/0
    location: {path: infra/terraform/network.tf, line: 11}
    expected:
      detections:
        - {tool: trivy, rule: AWS-0107}
        - {tool: checkov, rule: CKV_AWS_24}

  - id: GT-IAC-003
    owner: A9
    category: IAC
    title: Orders database publicly accessible and not encrypted
    location: {path: infra/terraform/database.tf, line: 10}
    expected:
      detections:
        - {tool: trivy, rule: AWS-0180}
        - {tool: trivy, rule: AWS-0080}
        - {tool: checkov, rule: CKV_AWS_17}
        - {tool: checkov, rule: CKV_AWS_16}

  - id: GT-IAC-004
    owner: A9
    category: IAC
    title: IAM policy allowing every action on every resource
    location: {path: infra/terraform/iam.tf, line: 8}
    # Trivy 0.76.1's embedded checks do not flag this policy (jsonencode or aws_iam_policy_document); SentinelCI's
    # own Trivy check SENTINEL-AWS-0001 (cli/src/sentinelci/scanners/configs/trivy-checks) does.
    expected:
      detections:
        - {tool: trivy, rule: SENTINEL-AWS-0001}
        - {tool: checkov, rule: CKV_AWS_62}
        - {tool: checkov, rule: CKV_AWS_355}

  - id: GT-IAC-005
    owner: A9
    category: IAC
    title: Privileged root container with host network and the host filesystem mounted
    location: {path: infra/k8s/shop-api.yaml, line: 25}
    expected:
      detections:
        - {tool: trivy, rule: KSV-0017}
        - {tool: trivy, rule: KSV-0009}
        - {tool: trivy, rule: KSV-0023}
        - {tool: checkov, rule: CKV_K8S_16}

  - id: GT-IAC-006
    owner: A9
    category: IAC
    title: Container image runs as root (end-of-life base by mutable tag, remote script piped to sh)
    location: {path: services/shop-api/Dockerfile, line: 3}
    expected:
      detections:
        - {tool: trivy, rule: DS-0002}
        - {tool: checkov, rule: CKV_DOCKER_3}

  # ---------------------------------------------------------------- CI workflows (A9), never executed
  - id: GT-PIPELINE-001
    owner: A9
    category: PIPELINE
    title: pull_request_target builds the untrusted head with secrets (pwn request)
    location: {path: examples/bad-workflows/pwn-request.yml, line: 7}
    expected:
      gate: SC-009
      detections:
        - {tool: zizmor, rule: dangerous-triggers}

  - id: GT-PIPELINE-002
    owner: A9
    category: PIPELINE
    title: Issue title injected into a shell script
    location: {path: examples/bad-workflows/issue-title-injection.yml, line: 18}
    expected:
      gate: SC-009
      detections:
        - {tool: zizmor, rule: template-injection}

  - id: GT-PIPELINE-003
    owner: A9
    category: PIPELINE
    title: write-all token, actions on mutable refs, secrets inherited by a remote workflow
    location: {path: examples/bad-workflows/overprivileged-unpinned.yml, line: 10}
    expected:
      gate: SC-009
      detections:
        - {tool: zizmor, rule: excessive-permissions}
        - {tool: zizmor, rule: unpinned-uses}

  # ---------------------------------------------------------------- dependencies (A9)
  # The seven packages of the offline feed fixtures (eval/feeds), and lodash-es under the same advisory, so
  # enrichment, scoring and the gate run with no network. `vulnerability` is the id Grype reports, `cve` its
  # CVE alias. `gate` is what the engine gives with those fixtures and no sentinel.yaml (an unknown exposure
  # counts as internet-facing).
  - id: GT-SCA-001
    owner: A9
    category: SCA
    title: PyYAML 5.3.1, arbitrary code execution through full_load
    location: {path: services/shop-api/requirements.txt, line: 20}
    package: pkg:pypi/pyyaml@5.3.1
    vulnerability: GHSA-8q59-q68h-6hv4
    cve: CVE-2020-14343
    kev: false
    expected:
      gate: SC-002
      detections:
        - {tool: grype, rule: GHSA-8q59-q68h-6hv4}

  - id: GT-SCA-002
    owner: A9
    category: SCA
    title: requests 2.30.0 leaks the Proxy-Authorization header on an HTTPS redirect
    location: {path: services/shop-api/requirements.txt, line: 22}
    package: pkg:pypi/requests@2.30.0
    vulnerability: GHSA-j8r2-6x86-q33q
    cve: CVE-2023-32681
    kev: false
    expected:  # MEDIUM, P2: no gate rule
      detections:
        - {tool: grype, rule: GHSA-j8r2-6x86-q33q}

  - id: GT-SCA-003
    owner: A9
    category: SCA
    title: lxml 4.6.2 HTML cleaner XSS, in a dependency the service never imports
    location: {path: services/shop-api/requirements.txt, line: 18}
    package: pkg:pypi/lxml@4.6.2
    vulnerability: GHSA-jq4v-f5q6-mjqq
    cve: CVE-2021-28957
    kev: false
    imported: false
    expected:  # MEDIUM, P2: no gate rule
      detections:
        - {tool: grype, rule: GHSA-jq4v-f5q6-mjqq}

  - id: GT-SCA-004
    owner: A9
    category: SCA
    title: lodash 4.17.20 command injection through template
    location: {path: services/web/package.json, line: 8}
    package: pkg:npm/lodash@4.17.20
    vulnerability: GHSA-35jh-r3h4-6jhm
    cve: CVE-2021-23337
    kev: false
    expected:
      gate: SC-002
      detections:
        - {tool: grype, rule: GHSA-35jh-r3h4-6jhm}

  - id: GT-SCA-005
    owner: A9
    category: SCA
    title: minimist 1.2.5 prototype pollution, in a dependency the front end never imports
    location: {path: services/web/package.json, line: 10}
    package: pkg:npm/minimist@1.2.5
    vulnerability: GHSA-xvch-5gv4-984h
    cve: CVE-2021-44906
    kev: false
    imported: false
    expected:
      gate: SC-002
      detections:
        - {tool: grype, rule: GHSA-xvch-5gv4-984h}

  - id: GT-SCA-006
    owner: A9
    category: SCA
    title: log4j-core 2.14.1 remote code execution (Log4Shell), listed in CISA KEV
    location: {path: services/reports/pom.xml, line: 27}
    package: pkg:maven/org.apache.logging.log4j/log4j-core@2.14.1
    vulnerability: GHSA-jfh8-c2jp-5v3q
    cve: CVE-2021-44228
    kev: true
    expected:
      gate: SC-003
      detections:
        - {tool: grype, rule: GHSA-jfh8-c2jp-5v3q}

  - id: GT-SCA-007
    owner: A9
    category: SCA
    title: spring-beans 5.3.17 remote code execution (Spring4Shell), listed in CISA KEV
    location: {path: services/reports/pom.xml, line: 32}
    package: pkg:maven/org.springframework/spring-beans@5.3.17
    vulnerability: GHSA-36p3-wjmg-h94x
    cve: CVE-2022-22965
    kev: true
    expected:
      gate: SC-003
      detections:
        - {tool: grype, rule: GHSA-36p3-wjmg-h94x}

  - id: GT-SCA-008
    owner: A9
    category: SCA
    title: lodash-es 4.17.20 command injection through template, left over and never imported
    location: {path: services/web/package.json, line: 9}
    package: pkg:npm/lodash-es@4.17.20
    vulnerability: GHSA-35jh-r3h4-6jhm
    cve: CVE-2021-23337
    kev: false
    imported: false
    expected:
      gate: SC-002
      detections:
        - {tool: grype, rule: GHSA-35jh-r3h4-6jhm}

# Files that look sensitive but are safe: any detection by the listed tools is a false positive.
controls:
  - id: GT-CLEAN-001
    owner: A9
    category: SECRET
    title: Settings template with environment placeholders
    location: {path: services/shop-api/config/settings.example.yaml}
    must_not_detect: [gitleaks]

  - id: GT-CLEAN-002
    owner: A9
    category: SECRET
    title: Terraform variable marked sensitive, no literal credential
    location: {path: infra/terraform/variables.tf}
    must_not_detect: [gitleaks, trivy, checkov]

  - id: GT-CLEAN-003
    owner: A9
    category: IAC
    title: Hardened deployment with a network policy
    location: {path: infra/k8s/web.yaml}
    must_not_detect: [gitleaks, trivy, checkov]

  - id: GT-CLEAN-004
    owner: A9
    category: PIPELINE
    title: Pinned, least-privilege workflow passing untrusted input through the environment
    location: {path: examples/good-workflows/pinned-least-privilege.yml}
    must_not_detect: [zizmor]
