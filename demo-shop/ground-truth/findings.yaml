  - id: GT-CLEAN-002
    owner: A9
    category: SECRET
    title: Terraform variable marked sensitive, no literal credential
    location: {path: infra/terraform/variables.tf}
    must_not_detect: [gitleaks, trivy]

  - id: GT-CLEAN-003
    owner: A9
    category: IAC
    title: Hardened deployment with a network policy
    location: {path: infra/k8s/web.yaml}
    must_not_detect: [gitleaks, trivy]

  - id: GT-CLEAN-004
    owner: A9
    category: PIPELINE
    title: Pinned, least-privilege workflow passing untrusted input through the environment
