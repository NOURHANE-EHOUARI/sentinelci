# Ground truth of the demo-shop benchmark (SPEC section 17).
# Format: see README.md in this directory. Draft v1 proposed by A9; B9 owns the final schema.
# Paths are relative to demo-shop/. Detections were verified with the pinned tools:
# Gitleaks 8.30.1, Trivy 0.76.1 (embedded checks plus SentinelCI's own, SentinelCI configuration) and
# zizmor 1.32.0 (the same 11 findings as 1.31.1). Checkov is not used (ADR-0012); a seed no pinned tool
# detects says why in `known_miss`.
# SCA detections are Grype 0.121.0's on the pinned Syft 1.55.0's SBOM, verified with the Grype database
# built 2026-11-01T06:20:12Z (schema v6.1.10); they need such a database to be checked again (see
# README.md, Checks).
version: 1

seeds:
  # ---------------------------------------------------------------- secrets (A9): all FAKE
  - id: GT-SECRET-001
    owner: A9
    category: SECRET
    title: GitHub token in the shop-api settings
    relevance: 3  # B8 ranking (README, rubric fixed before any ranking was computed)
    relevance_why: >-
      a GitHub token in the repository: whoever reads the code can push to it (supply chain)
    location: {path: services/shop-api/config/settings.yaml, line: 8}
    fake: true
    expected:
      gate: SC-001
      detections:
        - {tool: gitleaks, rule: github-pat}

  - id: GT-SECRET-002
    owner: A9
    category: SECRET
    title: npm publish token in the web app's .npmrc
    relevance: 3  # B8 ranking (README, rubric fixed before any ranking was computed)
    relevance_why: >-
      an npm publish token: whoever reads the code can publish the web app's packages (supply chain)
    location: {path: services/web/.npmrc, line: 3}
    fake: true
    expected:
      gate: SC-001
      detections:
        - {tool: gitleaks, rule: npm-access-token}

  - id: GT-SECRET-003
    owner: A9
    category: SECRET
    title: AWS access key hard-coded in the Terraform provider
    relevance: 3  # B8 ranking (README, rubric fixed before any ranking was computed)
    relevance_why: >-
      an AWS access key: whoever reads the code acts as the provider's account
    location: {path: infra/terraform/providers.tf, line: 14}
    fake: true
    expected:
      gate: SC-001
      detections:
        - {tool: gitleaks, rule: aws-access-token}

  - id: GT-SECRET-004
    owner: A9
    category: SECRET
    title: TLS private key committed in a Kubernetes Secret
    relevance: 2  # B8 ranking (README, rubric fixed before any ranking was computed)
    relevance_why: >-
      the shop's TLS key: impersonating the shop also needs a network position
    location: {path: infra/k8s/shop-tls-secret.yaml, line: 15}
    fake: true
    expected:
      gate: SC-001
      detections:
        - {tool: gitleaks, rule: private-key}

  - id: GT-SECRET-005
    owner: A9
    category: SECRET
    title: Slack webhook in the production GitOps values
    relevance: 1  # B8 ranking (README, rubric fixed before any ranking was computed)
