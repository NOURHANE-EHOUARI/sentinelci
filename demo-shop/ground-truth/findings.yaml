  # ---------------------------------------------------------------- infrastructure as code (A9)
  - id: GT-IAC-001
    owner: A9
    category: IAC
    title: Product-images bucket public through its ACL and public-access block
    relevance: 1  # B8 ranking (README, rubric fixed before any ranking was computed)
