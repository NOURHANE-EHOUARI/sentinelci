  # ---------------------------------------------------------------- dependencies (A9)
  # The seven packages of the offline feed fixtures (eval/feeds), and lodash-es under the same advisory, so
  # enrichment, scoring and the gate run with no network. `vulnerability` is the id Grype reports, `cve` its
  # CVE alias. `gate` is what the engine gives with those fixtures and no sentinel.yaml (an unknown exposure
  # counts as internet-facing).
  - id: GT-SCA-001
    owner: A9
    category: SCA
    title: PyYAML 5.3.1, arbitrary code execution through full_load
    relevance: 3  # B8 ranking (README, rubric fixed before any ranking was computed)
    relevance_why: >-
      PyYAML 5.3.1 is imported and loads untrusted input with FullLoader on the internet-facing shop-api (GT-
      SAST-003): remote code execution
    location: {path: services/shop-api/requirements.txt, line: 20}
    package: pkg:pypi/pyyaml@5.3.1
    vulnerability: GHSA-8q59-q68h-6hv4
    cve: CVE-2020-14343
    kev: false
    imported: true  # app/main.py loads YAML with FullLoader (GT-SAST-003)
    # The BLOCK image's requirements pin it too (ADR-0011): Grype reports one finding with both places.
    also_in: [services/shop-api/requirements.block.txt]
    expected:
      gate: SC-002
      detections:
        - {tool: grype, rule: GHSA-8q59-q68h-6hv4}

  - id: GT-SCA-002
    owner: A9
    category: SCA
    title: requests 2.30.0 leaks the Proxy-Authorization header on an HTTPS redirect
    relevance: 1  # B8 ranking (README, rubric fixed before any ranking was computed)
    relevance_why: >-
      the leak needs a proxy with credentials and an HTTPS redirect
    location: {path: services/shop-api/requirements.txt, line: 22}
    package: pkg:pypi/requests@2.30.0
    vulnerability: GHSA-j8r2-6x86-q33q
    cve: CVE-2023-32681
    kev: false
    imported: true  # app/main.py and app/orders.py call requests
    expected:  # MEDIUM, P2: no gate rule
      detections:
        - {tool: grype, rule: GHSA-j8r2-6x86-q33q}

