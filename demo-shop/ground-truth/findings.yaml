  - id: GT-IAC-004
    owner: A9
    category: IAC
    title: IAM policy allowing every action on every resource
    relevance: 2  # B8 ranking (README, rubric fixed before any ranking was computed)
    relevance_why: >-
      an IAM policy allowing everything: it needs a foothold that uses it
    location: {path: infra/terraform/iam.tf, line: 8}
