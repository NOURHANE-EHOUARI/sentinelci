# SentinelCI local platform (SPEC §4.4, Sprint 0 checklist item 7). LOCAL ONLY.
#
#   make up                                      # postgres + pgvector, redis, seaweedfs (S3), api
#   COMPOSE_PROFILES=ai make up                  # + ollama and the worker (explanations)
#   COMPOSE_PROFILES=ai,observability make up    # + prometheus, grafana
#
# Rules enforced by tests/deploy/test_compose.py:
# - every image is pinned by tag AND digest (Dependabot keeps them fresh, with a 7-day cooldown);
# - every published port binds 127.0.0.1 only;
# - no credential lives in this file: they come from deploy/compose/.env, generated by `make compose-env`
#   and git-ignored. A missing variable stops Compose instead of falling back to a default password;
# - every service has a healthcheck and runs with no-new-privileges.
#
# The web dashboard (React, task B7) is served by its own dev server for now (platform/web/README.md).

name: sentinelci

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]

services:
  # Runs, findings, decisions, waivers, groups (B1); embeddings for correlation (A7).
  postgres:
    <<: *hardening
    image: pgvector/pgvector:0.8.7-pg18@sha256:2358fcba361ed2233a5ed81b5fe4ca779ccb304120ce531a3bf51c0ed7e2bc11
    environment:
      POSTGRES_USER: sentinel
      POSTGRES_DB: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run make compose-env}
    volumes:
      # PostgreSQL 18 images keep their data under /var/lib/postgresql/18/docker.
      - postgres-data:/var/lib/postgresql
      - ./postgres/initdb:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=sentinel --dbname=sentinel"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Celery broker and result backend (B1).
  redis:
    <<: *hardening
    image: redis:8.10.3@sha256:298641b35ac51aa999f9bb85707d6681fe635ce59cda51886a0b6adc1da37b8e
    command: ["sh", "-c", 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run make compose-env}
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20

  # Evidence store, S3 API (ADR-0007). Only the authenticated S3 gateway is reachable from outside the
  # container: master, volume and filer bind to its loopback, and the unauthenticated Iceberg and Lance
  # catalogs are turned off.
  seaweedfs:
    <<: *hardening
    image: chrislusf/seaweedfs:4.48@sha256:4e61d15fd35994cb1e43e1e553dff106794841fd9a99ade2fc8c8bfce4d7872d
    command:
      - server
      - -dir=/data
      - -ip=127.0.0.1
      - -ip.bind=127.0.0.1
      - -s3
      - -s3.port=8333
      - -s3.ip.bind=0.0.0.0
      - -s3.port.iceberg=0
      - -s3.port.lance=0
    environment:
      # Admin credentials of the S3 gateway (used because no S3 config file is given).
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?run make compose-env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?run make compose-env}
    volumes:
      - seaweedfs-data:/data
    ports:
      - "127.0.0.1:${S3_PORT:-8333}:8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 5s
      timeout: 3s
      retries: 30

  # Control-plane API (B1). Built from this workspace; runs as an unprivileged user on a read-only root.
  api:
    <<: *hardening
    build: &api-build
      context: ../..
      dockerfile: platform/api/Dockerfile
    image: sentinelci/api:dev
    environment:
      SENTINEL_DATABASE_URL: postgresql://sentinel:${POSTGRES_PASSWORD:?run make compose-env}@postgres:5432/sentinel
      SENTINEL_REDIS_URL: redis://:${REDIS_PASSWORD:?run make compose-env}@redis:6379/0
      SENTINEL_S3_ENDPOINT: http://seaweedfs:8333
      SENTINEL_S3_ACCESS_KEY: ${S3_ACCESS_KEY:?run make compose-env}
      SENTINEL_S3_SECRET_KEY: ${S3_SECRET_KEY:?run make compose-env}
      # Only the hash: the API checks tokens, it never holds one (deploy/compose/make_env.py).
      SENTINEL_API_TOKEN_SHA256: ${SENTINEL_API_TOKEN_SHA256:?run make compose-env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      seaweedfs:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20

  # Local LLM for the AI analyst (B5). No model is pulled automatically (Sprint 0 checklist item 10).
  ollama:
    <<: *hardening
    profiles: [ai]
    image: ollama/ollama:0.40.8@sha256:2b8eecdb85aa6ea67c381c8ecffec04b2658496cf2821a8f88b0485bdff198e8
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "127.0.0.1:${OLLAMA_PORT:-11434}:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  # The worker (B5c): the AI analyst's jobs from the Redis queue (Celery, JSON only), with the API's image.
  # It reaches the database, the queue and Ollama only: no API token, no S3 credential, no published port.
  worker:
    <<: *hardening
    profiles: [ai]
    build: *api-build  # the same image as the API's
    image: sentinelci/api:dev
    command: ["celery", "-A", "sentinel_worker.tasks", "worker", "--concurrency", "1", "--loglevel", "INFO"]
    environment:
      SENTINEL_DATABASE_URL: postgresql://sentinel:${POSTGRES_PASSWORD:?run make compose-env}@postgres:5432/sentinel
      SENTINEL_REDIS_URL: redis://:${REDIS_PASSWORD:?run make compose-env}@redis:6379/0
      SENTINEL_OLLAMA_URL: http://ollama:11434
    depends_on:
      api:
        condition: service_healthy  # the API ran the migrations
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "celery -A sentinel_worker.tasks inspect ping -d celery@$$HOSTNAME --timeout 5"]
      interval: 30s
      timeout: 15s
      retries: 5

  # Metrics (A8 adds the SentinelCI targets).
  prometheus:
    <<: *hardening
    profiles: [observability]
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Dashboards as code (A8). Anonymous access, sign-up and phone-home are off.
  grafana:
    <<: *hardening
    profiles: [observability]
    image: grafana/grafana:13.2.4@sha256:dbbc38ea21103cefb50396340cd88afec779c7e070b0a7bf5a75b4ce46651d3f
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?run make compose-env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    cap_drop: [ALL]
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  postgres-data:
  redis-data:
  seaweedfs-data:
  ollama-models:
  prometheus-data:
  grafana-data:
