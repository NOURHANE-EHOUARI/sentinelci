[project]
name = "sentinelci"
version = "0.1.0"
description = "SentinelCI core library and CLI: scan, normalize, enrich, score, decide, attest, verify, replay."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15",
    "pydantic>=2.10",
]

[project.scripts]
sentinel = "sentinelci.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinelci"]
