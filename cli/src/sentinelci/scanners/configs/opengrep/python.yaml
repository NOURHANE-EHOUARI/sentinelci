# SentinelCI's SAST rules for Python (Opengrep, Semgrep rule format). Owned by SentinelCI: the scanned
# repository never adds, changes or silences a rule (exceptions are waivers). Messages are fixed text, never
# interpolated with code, so no code reaches a finding. Every rule is pinned by a positive and a negative case
# in cli/tests/scanners/test_opengrep_rules.py.
rules:
  - id: python-shell-command-from-data
    languages: [python]
    severity: ERROR
    message: A command that is not a constant string runs through a shell; data in it can run other commands.
    metadata:
      title: OS command built from data runs through a shell
      cwe: [CWE-78]
      confidence: HIGH
    patterns:
      - pattern-either:
          - patterns:
              - pattern: subprocess.$FUNC($CMD, ..., shell=True, ...)
              - metavariable-regex:
                  metavariable: $FUNC
                  regex: ^(run|call|check_call|check_output|Popen)$
          - pattern: subprocess.getoutput($CMD)
          - pattern: subprocess.getstatusoutput($CMD)
          - pattern: os.system($CMD)
          - pattern: os.popen($CMD, ...)
      - metavariable-pattern:
          metavariable: $CMD
          patterns:
            - pattern-not: '"..."'

  - id: python-code-evaluated-from-data
    languages: [python]
    severity: ERROR
    message: eval or exec runs code that is not a constant string; data in it runs as Python.
    metadata:
      title: Python code evaluated from data
      cwe: [CWE-95]
      confidence: HIGH
    patterns:
      - pattern-either:
          - pattern: eval($CODE, ...)
          - pattern: exec($CODE, ...)
      - metavariable-pattern:
          metavariable: $CODE
          patterns:
            - pattern-not: '"..."'

  - id: python-sql-built-from-strings
    languages: [python]
    severity: ERROR
    message: A SQL statement is built by formatting or concatenating strings; pass values as query parameters.
    metadata:
      title: SQL statement built from strings
      cwe: [CWE-89]
      confidence: HIGH
    pattern-either:
      # The receiver's name does not matter (cursor, connection, session): the method's name does.
      - patterns:
          - pattern-either:
              - pattern: $DB.$EXEC(f"...", ...)
              - pattern: $DB.$EXEC("..." % $VALUES, ...)
              - pattern: $DB.$EXEC("..." + $VALUE, ...)
              - pattern: $DB.$EXEC($VALUE + "...", ...)
              - pattern: $DB.$EXEC("...".format(...), ...)
              # The statement built in a variable first, then executed: the most common shape of CWE-89.
              - patterns:
                  - pattern-either:
                      - pattern-inside: |
                          $Q = f"..."
                          ...
                      - pattern-inside: |
                          $Q = "..." % $VALUES
                          ...
                      - pattern-inside: |
                          $Q = "..." + $VALUE
                          ...
                      - pattern-inside: |
                          $Q = "...".format(...)
                          ...
                  - pattern: $DB.$EXEC($Q, ...)
          - metavariable-regex:
              metavariable: $EXEC
              regex: ^(execute|executemany|executescript|exec_driver_sql)$
      - pattern: sqlalchemy.text(f"...")
      - pattern: sqlalchemy.text("..." % $VALUES)
      - pattern: sqlalchemy.text("..." + $VALUE)
      - pattern: sqlalchemy.text("...".format(...))

  - id: python-unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: Data is deserialized with a format that can run code (pickle, marshal, unsafe YAML loaders).
    metadata:
      title: Deserialization that can run code
      cwe: [CWE-502]
      confidence: MEDIUM
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - pattern: marshal.loads(...)
      - pattern: marshal.load(...)
      # PyYAML's loaders that can build arbitrary Python objects: the full and unsafe ones, by name, by keyword
      # or as the second argument, for one document or for all of them (FullLoader runs code in pyyaml < 5.4).
      - pattern: yaml.unsafe_load(...)
      - pattern: yaml.unsafe_load_all(...)
      - pattern: yaml.full_load(...)
      - pattern: yaml.full_load_all(...)
      - patterns:
          - pattern-either:
              - pattern: yaml.$LOAD(..., Loader=yaml.$LOADER, ...)
              - pattern: yaml.$LOAD(..., Loader=yaml.$MODULE.$LOADER, ...)
              - pattern: yaml.$LOAD($DATA, yaml.$LOADER, ...)
              - pattern: yaml.$LOAD($DATA, yaml.$MODULE.$LOADER, ...)
          # load and load_all only: add_constructor, compose and parse take a Loader but build no object.
          - metavariable-regex:
              metavariable: $LOAD
              regex: ^load(_all)?$
          # Loader, FullLoader, UnsafeLoader and their libyaml twins (CLoader, CFullLoader, CUnsafeLoader), from
          # yaml or from its yaml.loader and yaml.cyaml modules.
          - metavariable-regex:
              metavariable: $LOADER
              regex: ^C?(Full|Unsafe)?Loader$
      - patterns:
          - pattern-either: &no-loader
              # No loader: pyyaml < 5.1 builds any object, 5.1 to 5.4 falls back to FullLoader with a warning
              # (6.0 refuses the call). Loader=None is the same fallback.
              - pattern: yaml.load($DATA)
              - pattern: yaml.load_all($DATA)
              - pattern: yaml.load(stream=$DATA)
              - pattern: yaml.load_all(stream=$DATA)
              - pattern: yaml.load(..., Loader=None, ...)
              - pattern: yaml.load_all(..., Loader=None, ...)
              - pattern: yaml.load($DATA, None)
              - pattern: yaml.load_all($DATA, None)
          # A local named yaml that holds what a call returned is not PyYAML: the ruamel.yaml idiom is
          # `yaml = YAML()`. The exclusion covers the statements after that binding, in the same function.
          # `yaml = None` (an import fallback) excludes nothing.
          - pattern-not-inside: |
              yaml = $FACTORY(...)
              ...
      # ...in a file that imports ruamel.yaml only. Anywhere else such a local is still PyYAML's (`im("yaml")`,
      # `importlib.reload(yaml)`, a lazy import). The import pattern also matches `import ruamel.yaml as ry`
      # and `from ruamel.yaml import YAML [as Y]`, but not an import inside `try` (flagged, the safe side). It
      # is a separate branch, not part of the exclusion above: `import ruamel.yaml` then `...` would reach
      # every later function of the file (#84 review, round 4).
      - patterns:
          - pattern-either: *no-loader
          - pattern-not-inside: |
              import ruamel.yaml
              ...
      # ...unless that call imports PyYAML (import_module, __import__, pytest.importorskip), or builds
      # ruamel.yaml's unsafe loader, `YAML(typ="unsafe")` or a `typ` list naming "unsafe" (ruamel picks it when
      # the list names no rt, safe or base), which runs code, or takes `typ` from a name, whose value the rule
      # cannot see (#84 review, rounds 2 to 4).
      - patterns:
          - pattern-either: *no-loader  # the same calls as above (a YAML alias, so the two lists never drift)
          - pattern-either:
              - patterns:
                  - pattern-inside: |
                      yaml = $FACTORY(...)
                      ...
                  - metavariable-regex:
                      metavariable: $FACTORY
                      regex: ^((importlib\.)?import_module|__import__|(pytest\.)?importorskip)$
              - pattern-inside: |
                  yaml = $FACTORY(..., typ="unsafe", ...)
                  ...
              - pattern-inside: |
                  yaml = $FACTORY(..., typ=[..., "unsafe", ...], ...)
                  ...
              # typ from a name (a constant or a parameter): `TYP = ["unsafe"]` runs code, `KIND = "safe"` is
              # flagged too, as on main (a string constant is resolved by constant propagation, a list is not).
              - patterns:
                  - pattern-inside: |
                      yaml = $FACTORY(..., typ=$TYP, ...)
                      ...
                  - metavariable-regex:
                      metavariable: $TYP
                      regex: ^[A-Za-z_][A-Za-z0-9_.]*$

  - id: python-tls-verification-disabled
    languages: [python]
    severity: WARNING
    message: TLS certificate verification is turned off; anyone on the network path can read or change the traffic.
    metadata:
      title: TLS certificate verification disabled
      cwe: [CWE-295]
      confidence: HIGH
    pattern-either:
      - pattern: requests.$METHOD(..., verify=False, ...)
      - pattern: httpx.$METHOD(..., verify=False, ...)
      - pattern: ssl._create_unverified_context(...)

  - id: python-debug-mode-enabled
    languages: [python]
    severity: WARNING
    message: The web framework runs in debug mode, which can show code and stack traces to anyone.
    metadata:
      title: Web framework debug mode enabled
      cwe: [CWE-489]
      confidence: MEDIUM
    pattern-either:
      - pattern: $APP.run(..., debug=True, ...)
      - pattern: fastapi.FastAPI(..., debug=True, ...)

  - id: python-jwt-signature-not-verified
    languages: [python]
    severity: ERROR
    message: A JWT is decoded without verifying its signature or with the "none" algorithm; anyone can forge it.
    metadata:
      title: JWT signature not verified
      cwe: [CWE-347]
      confidence: HIGH
    pattern-either:
      - pattern: 'jwt.decode(..., options={..., "verify_signature": False, ...}, ...)'
      - pattern: jwt.decode(..., verify=False, ...)
      - pattern: jwt.decode(..., algorithms=[..., "none", ...], ...)
