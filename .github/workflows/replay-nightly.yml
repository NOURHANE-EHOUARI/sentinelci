name: replay-nightly

# SPEC section 6.5 and section 3 ("replay determinism: 100% identical, nightly replay job").
# Each night: replay the previous night's decisions with today's engine, replay the real release decisions of the
# last demo-shop runs on main (their `sentinel-evidence` artifacts), then record, replay and upload a fresh
# corpus (eval/replay/corpus.py). A decision that changes for the same inputs without an engine or OPA version
# change turns this red. Only the last successful run's corpus is replayed, so a red night stays red until the
# change is reverted or the engine version is bumped (decisions of another engine or OPA version are skipped).
on:
  schedule:
    - cron: "41 2 * * *" # 02:41 UTC, off the hour
  workflow_dispatch:

permissions: {}

concurrency:
  group: replay-nightly
  cancel-in-progress: false

defaults:
  run:
    shell: bash # -eo pipefail

jobs:
  replay:
    name: replay decisions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # find and download the previous night's corpus artifact
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --locked

      # Same OPA as every decision: tools.lock.toml, hash-verified, fail closed on a mismatch.
      - name: Install OPA (tools.lock.toml, hash-verified)
        run: |
          uv run sentinel tools install opa --dest "$RUNNER_TEMP/sentinel-tools"
          echo "SENTINEL_OPA=$RUNNER_TEMP/sentinel-tools/bin/opa" >> "$GITHUB_ENV"

      - name: Find the previous corpus
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          run_id=$(gh api "repos/$REPO/actions/workflows/replay-nightly.yml/runs?branch=main&status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          if [ -z "$run_id" ]; then
            echo "No successful nightly yet: nothing to replay from a previous night." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Download the previous corpus
        if: steps.previous.outputs.run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: replay-corpus
          path: ${{ runner.temp }}/previous
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
          digest-mismatch: error

      - name: Replay the previous night's decisions with today's engine
        if: steps.previous.outputs.run_id != ''
        run: |
          set +e
          # After an engine or OPA version bump every previous decision is skipped: that night says so in its
          # summary instead of failing. Tonight's corpus below is always compared, without this flag.
          uv run sentinel replay --all --allow-all-skipped --store "$RUNNER_TEMP/previous" \
            > "$RUNNER_TEMP/previous.txt" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/previous.txt"
          {
            echo "### Previous night's decisions, replayed (exit $code)"
            echo '```'
            cat "$RUNNER_TEMP/previous.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      # Only runs triggered by a push to main: their workflow file and pipeline are main's own. Evidence from
      # pull-request runs is not replayed here, because a pull request can edit the workflow that uploads it.
      - name: Replay the release decisions of the last demo-shop runs on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          runs=$(gh api \
            "repos/$REPO/actions/workflows/demo-shop.yml/runs?branch=main&event=push&status=completed&per_page=5" \
            --jq '.workflow_runs[].id') || exit 1
          failed=0
          {
            echo "### Release decisions of the last demo-shop runs on main, replayed"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          for run in $runs; do
            store="$RUNNER_TEMP/releases/$run"
            # Only a missing or expired artifact is a normal skip; one that exists but cannot be downloaded fails.
            available=$(gh api "repos/$REPO/actions/runs/$run/artifacts?name=sentinel-evidence" \
              --jq '[.artifacts[] | select(.expired == false)] | length') || available=error
            if [ "$available" = 0 ]; then
              echo "run $run: no sentinel-evidence artifact (expired, or no decision was made)" \
                | tee -a "$GITHUB_STEP_SUMMARY"
              continue
            fi
            if [ "$available" = error ] \
              || ! gh run download "$run" --repo "$REPO" --name sentinel-evidence --dir "$store" > /dev/null 2>&1; then
              echo "run $run: sentinel-evidence could not be listed or downloaded" | tee -a "$GITHUB_STEP_SUMMARY"
              failed=1
              continue
            fi
            code=0
            # Releases made before an engine or OPA bump are all skipped: allowed, and said in the summary.
            result=$(uv run sentinel replay --all --allow-all-skipped --store "$store" 2>&1) || code=$?
            echo "run $run (exit $code): $result" | tee -a "$GITHUB_STEP_SUMMARY"
            [ "$code" -eq 0 ] || failed=1
          done
          [ -n "$runs" ] || echo "no completed demo-shop run on main yet" | tee -a "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit "$failed"

      - name: Record tonight's corpus
        run: uv run python eval/replay/corpus.py --store out/replay-corpus --work "$RUNNER_TEMP/corpus-work"

      - name: Replay tonight's corpus in a fresh process
        run: |
          set +e
          uv run sentinel replay --all --store out/replay-corpus > "$RUNNER_TEMP/tonight.txt" 2>&1
          code=$?
          set -e
          cat "$RUNNER_TEMP/tonight.txt"
          {
            echo "### Tonight's corpus, replayed (exit $code)"
            echo '```'
            cat "$RUNNER_TEMP/tonight.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Upload tonight's corpus
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: replay-corpus
          path: out/replay-corpus
          retention-days: 14
          if-no-files-found: error
