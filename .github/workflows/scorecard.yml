name: scorecard

# OpenSSF Scorecard (task A10): this repository's own supply-chain practices, scored by an outside tool (pinned
# actions, token permissions, branch protection, signed releases, dependency updates, ...). Its result is
# published to the Scorecard API, where the README badge reads it.
#
# It runs only once the repository is public: in the private phase (ADR-0006) Scorecard could not publish, most
# of its checks need a public repository, and publishing would reveal the repository. No SARIF goes to GitHub
# code scanning (ADR-0006: results go to artifacts); the job keeps it as an artifact.
#
# The action is pinned by commit; it runs the image ghcr.io/ossf/scorecard-action named by that commit's
# action.yaml. `id-token: write` lets it sign the published result with Sigstore; nothing else is granted.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC
  workflow_dispatch:

permissions: {}

concurrency:
  group: scorecard
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read # read the repository's files and settings
      actions: read # read the workflow runs, for the token-permissions and CI checks
      id-token: write # sign the published result with Sigstore (publish_results)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@46dc3187a971a9febf3aeb7f94ccde489f7bb46a # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true

      - name: Keep the result
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard
          path: scorecard.sarif
          retention-days: 30
          if-no-files-found: error
