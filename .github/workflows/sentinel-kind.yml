# Release admission on a real cluster (task A5b, SPEC section 7, ADR-0011 decision 5).
#
# Creates the demo cluster exactly as `make kind-up` does on a laptop (kind, its registry, Kyverno; everything
# pinned in tools.lock.toml and deploy/kind/), then lets the Kyverno admission controller judge a release that
# `sentinel attest --push` attested and the images it must deny. About ten minutes: it runs by hand, and on a
# pull request only when the cluster's setup or the admission policy changes (GitHub Free minutes).
name: sentinel-kind

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "deploy/kind/**"
      - "cli/src/sentinelci/supplychain/admission.py"
      - "cli/src/sentinelci/supplychain/kyverno/**"
      - "cli/tests/supplychain/test_kind_admission.py"
      - ".github/workflows/sentinel-kind.yml"

# The job runs repository code (the CLI, the setup script): it only reads the repository and holds no secret.
# Its release key is made by the test and never leaves the runner.
permissions:
  contents: read

concurrency:
  group: sentinel-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    name: Kyverno admission on kind
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked

      # kind, Cosign and crane from tools.lock.toml, hash-checked; Docker and kubectl are the runner's.
      - name: Install the pinned tools
        run: |
          uv run sentinel tools install kind cosign crane --dest "$RUNNER_TEMP/sentinel-tools"
          echo "SENTINEL_TOOLS_DIR=$RUNNER_TEMP/sentinel-tools" >> "$GITHUB_ENV"

      - name: Create the cluster (registry, kind, Kyverno)
        run: make kind-up

      - name: Admission on the cluster
        env:
          SENTINEL_KIND_CONTEXT: kind-sentinel
        run: uv run pytest -p no:cacheprovider -rA cli/tests/supplychain/test_kind_admission.py

      - name: Kyverno diagnostics
        if: failure()
        run: |
          kubectl --context kind-sentinel get imagevalidatingpolicies -o yaml || true
          kubectl --context kind-sentinel --namespace kyverno get pods || true
          kubectl --context kind-sentinel --namespace kyverno logs deployment/kyverno-admission-controller --tail=300 || true

      - name: Delete the cluster
        if: always()
        run: make kind-down
