# Release admission and the GitOps deploy on a real cluster (task A5b, SPEC section 7, ADR-0011 decision 5).
#
# Creates the demo cluster exactly as `make kind-up` does on a laptop (kind, its registry, Kyverno, Argo CD and
# the GitOps git server; everything pinned in tools.lock.toml and deploy/kind/), then:
# - lets the Kyverno admission controller judge a release that `sentinel attest --push` attested and the images
#   it must deny;
# - runs `make demo-release`'s steps on a release bundle: cosign load, sentinel verify, the GitOps commit, Argo
#   CD's sync and the rollout.
# About fifteen minutes: it runs by hand, and on a pull request only when the cluster's setup, the demo's
# deploy or the admission policy changes (GitHub Free minutes).
name: sentinel-kind

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "deploy/kind/**"
      - "deploy/argocd/**"
      - "deploy/helm/**"
      - "cli/src/sentinelci/supplychain/admission.py"
      - "cli/src/sentinelci/supplychain/kyverno/**"
      - "cli/tests/supplychain/test_kind_admission.py"
      - "cli/tests/supplychain/test_kind_demo.py"
      - ".github/workflows/sentinel-kind.yml"

# The job runs repository code (the CLI, the setup script): it only reads the repository and holds no secret.
# Its release key is made by the test and never leaves the runner.
permissions:
  contents: read

concurrency:
  group: sentinel-kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  admission:
    name: Kyverno admission on kind
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          enable-cache: false

      - name: Install locked dependencies
        run: uv sync --locked

      # kind, Cosign and crane from tools.lock.toml, hash-checked; Docker, kubectl, git and Go are the
      # runner's (Go builds the test's release image, a static health server).
      - name: Install the pinned tools
        run: |
          go version
          uv run sentinel tools install kind cosign crane --dest "$RUNNER_TEMP/sentinel-tools"
          echo "SENTINEL_TOOLS_DIR=$RUNNER_TEMP/sentinel-tools" >> "$GITHUB_ENV"

      - name: Create the cluster (registry, kind, Kyverno, Argo CD, GitOps server)
        run: make kind-up

      - name: Admission and the GitOps deploy on the cluster
        env:
          SENTINEL_KIND_CONTEXT: kind-sentinel
        run: >-
          uv run pytest -p no:cacheprovider -rA
          cli/tests/supplychain/test_kind_admission.py cli/tests/supplychain/test_kind_demo.py

      - name: Kyverno diagnostics
        if: failure()
        run: |
          kubectl --context kind-sentinel get imagevalidatingpolicies -o yaml || true
          kubectl --context kind-sentinel --namespace kyverno get pods || true
          kubectl --context kind-sentinel --namespace kyverno logs deployment/kyverno-admission-controller --tail=300 || true

      - name: Argo CD and GitOps diagnostics
        if: failure()
        run: |
          kubectl --context kind-sentinel --namespace argocd get applications -o yaml || true
          kubectl --context kind-sentinel --namespace argocd get pods || true
          kubectl --context kind-sentinel --namespace argocd logs statefulset/argocd-application-controller --tail=200 || true
          kubectl --context kind-sentinel --namespace argocd logs deployment/argocd-repo-server --tail=200 || true
          kubectl --context kind-sentinel --namespace sentinel-gitops get pods -o wide || true
          kubectl --context kind-sentinel --namespace sentinel-gitops logs deployment/gitops --tail=100 || true
          kubectl --context kind-sentinel --namespace demo-shop get all,events || true

      - name: Delete the cluster
        if: always()
        run: make kind-down
