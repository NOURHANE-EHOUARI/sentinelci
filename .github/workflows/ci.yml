name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default: every job only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, contracts, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          python-version: "3.12"

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Architecture contract (deterministic decides, AI advises)
        run: uv run lint-imports

      # Pinned and checksum-verified before use: a mismatch fails the job (principle P2).
      # Keep in sync with tools.lock.yaml once it exists (task A1).
      - name: Install OPA (pinned, verified)
        env:
          OPA_VERSION: 1.21.4
          OPA_SHA256: 2ab571f367f293bb19523b76f92f1945bbf245003392c7f392903f95c2b9b630
        run: |
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 \
            --output "$RUNNER_TEMP/opa" \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  $RUNNER_TEMP/opa" | sha256sum --check --strict -
          chmod +x "$RUNNER_TEMP/opa"
          echo "SENTINEL_OPA=$RUNNER_TEMP/opa" >> "$GITHUB_ENV"

      - name: Policies (format, strict compile, unit tests, coverage >= 90%)
        run: make policy

      - name: Tests (including JSON Schema contracts)
        env:
          SENTINEL_REQUIRE_OPA: "1"
        run: uv run pytest

  workflow-security:
    name: workflow security (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.11.32"
          python-version: "3.12"

      - name: Audit GitHub Actions workflows
        run: uv run --locked zizmor --offline --min-severity low .github/workflows
