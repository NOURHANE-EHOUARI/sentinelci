name: ci

on:
  pull_request:
  push:
    branches: [main]

# Least privilege by default: every job only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: lint, types, contracts, tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          # Explicit (setup-uv's default turns it on for hosted runners): this job runs the change's own code
          # anyway, holds no write token, and no job that judges reads uv's cache, since those keep it off
          # (ADR-0015).
          enable-cache: true

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type-check
        run: uv run mypy

      - name: Architecture contract (deterministic decides, AI advises)
        run: uv run lint-imports

      # Only the scanners' release archives are kept between runs: each is checked against tools.lock.toml's sha256
      # before use, and the binary is extracted again from it, so a cache entry written elsewhere can only cost a
      # download (ADR-0015). Never the binaries, never a package manager's cache.
      - name: Restore the verified release archives
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sentinel-tools/cache
          key: sentinel-tool-archives-checks-${{ runner.os }}-${{ hashFiles('tools.lock.toml') }}

      # OPA comes from tools.lock.toml like every security tool: `sentinel tools install` checks the release
      # asset's SHA-256 before installing it and fails closed on a mismatch (principle P2, rule SC-010).
      - name: Install OPA (tools.lock.toml, hash-verified)
        run: |
          uv run sentinel tools install opa --dest "$RUNNER_TEMP/sentinel-tools"
          echo "SENTINEL_OPA=$RUNNER_TEMP/sentinel-tools/bin/opa" >> "$GITHUB_ENV"

      - name: Policies (format, strict compile, unit tests, coverage >= 90%)
        run: make policy

      - name: Tests (including JSON Schema contracts and Compose invariants)
        env:
          SENTINEL_REQUIRE_OPA: "1"
          SENTINEL_REQUIRE_DOCKER: "1"
          SENTINEL_REQUIRE_DOCKER_DAEMON: "1"  # ubuntu-24.04 runners have a daemon: the sandbox tests must run
        run: uv run pytest

  dashboard:
    name: dashboard (typed client, types, tests, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: platform/web
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          package-manager-cache: false # no cache another workflow could have written

      # npm ci installs exactly package-lock.json (with its integrity hashes) and runs no package script
      # (ignore-scripts=true in platform/web/.npmrc).
      - name: Install the locked dependencies
        run: npm ci

      - name: Client up to date, type-check, tests, build
        run: npm run check

  workflow-security:
    name: workflow security (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.11.32"
          python-version: "3.12"
          # Explicit (setup-uv's default turns it on for hosted runners): this job runs the change's own code
          # anyway, holds no write token, and no job that judges reads uv's cache, since those keep it off
          # (ADR-0015).
          enable-cache: true

      - name: Audit GitHub Actions workflows
        run: uv run --locked zizmor --offline --ignore-lockfile --min-severity low .github/workflows
