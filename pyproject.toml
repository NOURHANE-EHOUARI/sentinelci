[project]
name = "sentinelci-workspace"
version = "0.0.0"
description = "Workspace root for SentinelCI (not published)."
requires-python = ">=3.12"
dependencies = [
    "sentinelci",
    "sentinel-api",
    "sentinel-worker",
    "sentinel-ai",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.11",
    "mypy>=1.15",
    "jsonschema[format-nongpl]>=4.23",
    "import-linter>=2.3",
    "httpx2>=2.16",
    "pre-commit>=4.0",
    "types-pyyaml>=6.0.12",
]

[tool.uv]
package = false
default-groups = ["dev"]
# Nothing uploaded in the last week is resolved, transitive dependencies included: Dependabot's cooldown
# covers only the packages it updates (#135 review, grimp). The lock records the span, not a date, and
# tests/ci/test_dependabot.py keeps it equal to Dependabot's cooldown.
exclude-newer = "7 days"

[tool.uv.workspace]
members = ["cli", "platform/api", "platform/worker", "ai"]

[tool.uv.sources]
sentinelci = { workspace = true }
sentinel-api = { workspace = true }
sentinel-worker = { workspace = true }
sentinel-ai = { workspace = true }

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["demo-shop"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
# No PEP 695 type parameters (`def f[T]`, `class C[T]`, `type X = ...`): Opengrep cannot parse them, and the code
# it cannot parse goes unanalysed (`sentinel-sast-not-analysed`, P1 in the self-gate). TypeVars instead;
# tests/ci/test_python_syntax.py keeps the tree free of them.
ignore = ["UP040", "UP046", "UP047"]

[tool.ruff.lint.isort]
known-first-party = ["sentinelci", "sentinel_api", "sentinel_worker", "sentinel_ai"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S311", "S603", "S607"]  # asserts; seeded PRNG for fixtures; local git/subprocess in tests

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "cli/src", "platform/api/src", "platform/worker/src", "ai/src", "deploy/kind/cluster.py", "deploy/kind/demo.py",
    "deploy/release/release.py",
]

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["tests", "cli/tests", "platform/api/tests", "platform/worker/tests", "ai/tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
    "integration: uses real pinned scanners; runs only when SENTINEL_TOOLS_DIR points to `sentinel tools install` output",
]

# ---------------------------------------------------------------- import-linter
# Principle P1: deterministic decides, AI advises.
# The decision path (risk scoring and policy evaluation) must never depend on the AI package.
[tool.importlinter]
root_packages = ["sentinelci", "sentinel_ai"]

[[tool.importlinter.contracts]]
name = "Decision path never imports the AI package"
type = "forbidden"
source_modules = ["sentinelci.risk", "sentinelci.policy", "sentinelci.enrich", "sentinelci.normalize"]
forbidden_modules = ["sentinel_ai"]
