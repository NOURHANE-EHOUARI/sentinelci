[project]
name = "sentinel-ai"
version = "1.0.0"
description = "SentinelCI AI layer: explanations, triage hints, correlation and patch proposals. Advisory only."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.10",
    "sentinelci",
    "typer>=0.15",
]

[project.scripts]
sentinel-ai = "sentinel_ai.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_ai"]

[tool.uv.sources]
sentinelci = { workspace = true }
