# SentinelCI tool lock (SPEC §5, stage 0).
#
# Every security tool the pipeline runs is pinned here by version AND by SHA-256. `sentinel tools install`
# refuses to install an artifact whose hash differs, and `sentinel tools verify` refuses to let the pipeline
# continue if an installed binary no longer matches (fail closed, rule SC-010).
#
# Hashes were copied from each project's published checksum file for that exact release (linked below) on
# 2026-10-28. To upgrade a tool: open a PR that changes the version, URLs and hashes together, and link the
# upstream checksum file in the PR description so the reviewer can check every value. A Trivy upgrade also
# re-checks GT-IAC-004 (demo-shop ground truth): its known_miss names Trivy's version.
#
# Not pinned here yet:
# - opengrep: publishes keyless Cosign signatures but no checksum file; it will be pinned once
#   `sentinel tools pin` verifies the signature and records the digest (follow-up of task A1).

schema_version = 1


