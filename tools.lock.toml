# Python tools (SPEC §5): installed by `uv sync --locked` from PyPI, where the project publishes no checksum file
# for its binaries. uv checks each wheel against uv.lock at install time; the CLI checks the installed binary
# against `binary_sha256` right before every run, so a binary replaced or reinstalled later never runs.
# `sha256` must equal the wheel's hash in uv.lock (a test checks it), and `binary_sha256` was read from the
# RECORD inside that wheel (`zizmor-<version>.data/scripts/zizmor`) on 2026-11-01. To upgrade: bump the
# sentinelci dependency with `uv add`, then update the version and every wheel here in the same PR.

# CI workflow analysis (stage 4).
[python_tools.zizmor]
version = "1.31.1"
binary = "zizmor"

