# Waivers of demo-shop's gates: every `sentinel evaluate` of demo-shop reads this file from the base commit of
# what it judges (ADR-0008), the laptop release of shop-api included (ADR-0011). A waiver applies once it is
# reviewed and merged, never to the change that adds it. SentinelCI's own self-gate reads
# .sentinel/self-gate-waivers.yaml instead, so neither file applies to the other.
#
# The `base-` waivers below cover the Debian packages of the official python:3.12.16-slim-trixie image under
# shop-api's release image (decision of 14 November: no change to the risk score, no `apt-get upgrade` in the
# Dockerfile). They were drafted from the first release run on main (def5da7, 15 November, BLOCK SC-002 on 77
# P0 findings, all of them Debian packages of that image), one per vulnerability and package. 14 days when a fix is
# expected: Debian has one that the official image does not have yet (zlib1g), or the CVE is open in Debian with no
# decision (OpenSSL, advisory of 10 November; Grype's fix state not-fixed). 30 days when Debian ships no security
# update for trixie (Grype's wont-fix). A seed is never waived: the BLOCK image (requirements.block.txt, pyyaml
# 5.3.1, GT-CONTAINER-001) must always block.
#
# These waivers name a package, not an image (SC-005 refuses a purl with a version or qualifiers): they apply to
# the same CVE on the same Debian package in any image demo-shop's gates scan. Today only shop-api's release image
# is container-scanned; a gate that scans another image (the seeded Dockerfile's python:3.9) needs this list
# reviewed for it first.
version: 1
