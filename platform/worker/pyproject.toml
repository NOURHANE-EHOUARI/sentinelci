[project]
name = "sentinel-worker"
version = "0.1.0"
description = "SentinelCI background workers: GitHub sync, enrichment refresh, AI and remediation jobs."
requires-python = ">=3.12"
dependencies = [
    "sentinelci",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_worker"]
