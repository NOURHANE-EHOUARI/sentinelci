[project]
name = "sentinel-api"
version = "0.1.0"
description = "SentinelCI control-plane API: ingestion, GitHub sync and query endpoints."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "sentinelci",
    "uvicorn>=0.38",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_api"]
