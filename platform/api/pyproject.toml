[project]
name = "sentinel-api"
version = "0.1.0"
description = "SentinelCI control-plane API: ingestion and query endpoints."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.16",
    "celery[redis]>=5.5",
    "fastapi>=0.115",
    "psycopg[binary]>=3.2.9",
    "pyyaml>=6.0.2",
    "sentinel-ai",
    "sentinelci",
    "sqlalchemy>=2.0.40",
    "uvicorn>=0.38",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sentinel_api"]

[tool.uv.sources]
sentinel-ai = { workspace = true }
